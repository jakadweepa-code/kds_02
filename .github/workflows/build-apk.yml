name: Build APK Offline KDS 02

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Siapkan folder web offline (www)
        run: |
          mkdir -p www
          cp index.html www/
          cp *.jpg www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true

      - name: Inisialisasi Capacitor & proyek Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "KDS 02" "com.jakadweepa.kds02" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: kds-02-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
