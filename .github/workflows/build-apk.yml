name: Build APK Offline KDS 02

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Siapkan folder web offline (www)
        run: |
          mkdir -p www
          cp index.html www/
          cp *.jpg www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true

      - name: Inisialisasi Capacitor & proyek Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "KDS 02" "com.jakadweepa.kds02" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Konfigurasi izin kamera Android & WebView
        run: |
          python3 -c '
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m_text = manifest.read_text(encoding="utf-8")
          perm = "<uses-permission android:name=\"android.permission.CAMERA\" />"
          if perm not in m_text:
              idx = m_text.find(">") + 1
              m_text = m_text[:idx] + "\n    " + perm + m_text[idx:]
              manifest.write_text(m_text, encoding="utf-8")

          for act in Path("android/app/src/main").rglob("MainActivity.*"):
              code = act.read_text(encoding="utf-8")
              if act.suffix == ".java" and "onPermissionRequest" not in code:
                  if "import android.os.Bundle;" in code:
                      code = code.replace(
                          "import android.os.Bundle;",
                          "import android.Manifest;\nimport android.content.pm.PackageManager;\nimport android.os.Bundle;\nimport android.webkit.PermissionRequest;\nimport android.webkit.WebChromeClient;\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\nimport com.getcapacitor.BridgeActivity;",
                          1
                      )
                  target = "super.onCreate(savedInstanceState);"
                  inject = """super.onCreate(savedInstanceState);
          if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
              ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, 1001);
          }
          if (this.bridge != null && this.bridge.getWebView() != null) {
              this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                  @Override
                  public void onPermissionRequest(final PermissionRequest request) {
                      runOnUiThread(() -> request.grant(request.getResources()));
                  }
              });
          }"""
                  if target in code:
                      code = code.replace(target, inject, 1)
                      act.write_text(code, encoding="utf-8")
          '

      - name: Compile Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: kds-02-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
