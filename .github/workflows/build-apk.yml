name: Build APK Offline KDS 02

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Siapkan folder web offline (www)
        run: |
          mkdir -p www
          cp index.html www/
          cp *.jpg www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true

      - name: Inisialisasi Capacitor & proyek Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "KDS 02" "com.jakadweepa.kds02" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Konfigurasi izin kamera Android, WebView, & Ikon Aplikasi
        run: |
          python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET
          import shutil
          from pathlib import Path

          # 1. Tambah permission CAMERA di AndroidManifest.xml
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = {"android": "http://schemas.android.com/apk/res/android"}
          cam_perm = "android.permission.CAMERA"
          exists = any(
              elem.attrib.get("{http://schemas.android.com/apk/res/android}name") == cam_perm
              for elem in root.findall("uses-permission", ns)
          )
          if not exists:
              perm_elem = ET.Element("uses-permission", {"android:name": cam_perm})
              root.insert(0, perm_elem)
              tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # 2. Tulis ulang MainActivity.java agar runtime permission & WebView getUserMedia aktif
          main_java = Path("android/app/src/main/java/com/jakadweepa/kds02/MainActivity.java")
          main_java.parent.mkdir(parents=True, exist_ok=True)
          main_java.write_text("""package com.jakadweepa.kds02;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, 1001);
                  }

                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });
                  }
              }
          }
          """, encoding="utf-8")

          # 3. Salin ikon icon-karisma.png ke semua folder mipmap Android
          icon_src = Path("icon-karisma.png")
          if icon_src.exists():
              res_dir = Path("android/app/src/main/res")
              copied = 0

              for m_dir in sorted(res_dir.glob("mipmap-*")):
                  if m_dir.is_dir() and "anydpi" not in m_dir.name:
                      for fname in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                          shutil.copy2(icon_src, m_dir / fname)
                          copied += 1

              anydpi_dir = res_dir / "mipmap-anydpi-v26"
              if anydpi_dir.exists():
                  simple_icon = (
                      '<?xml version="1.0" encoding="utf-8"?>\n'
                      '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                      '    <foreground android:drawable="@mipmap/ic_launcher_foreground" />\n'
                      '    <background android:drawable="@mipmap/ic_launcher" />\n'
                      '</adaptive-icon>\n'
                  )
                  for xml_file in ["ic_launcher.xml", "ic_launcher_round.xml"]:
                      target_xml = anydpi_dir / xml_file
                      if target_xml.exists():
                          target_xml.write_text(simple_icon, encoding="utf-8")

              print(f"Sukses menyalin {icon_src} ke {copied} file mipmap.")
          else:
              print("ERROR: icon-karisma.png tidak ditemukan di root repositori!")
          PYEOF

      - name: Compile Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: kds-02-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
